# mpv: plays files and, through yt-dlp, YouTube and other sites.
# (mpv only treats lines starting with # as comments, so they sit on their own lines)

# best quality available
ytdl-format=bestvideo+bestaudio/best
# decode on the GPU: smoother, less battery and heat
hwdec=auto-safe
vo=gpu-next

# uosc draws the controls (flat, square, wallpaper colors: script-opts/uosc.conf)
osc=no
osd-bar=no
border=no
osd-font="FiraCode Nerd Font"
