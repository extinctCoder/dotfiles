# cava for the desktop's radial visualizer (Quickshell reads its stdout).
# Raw ascii output: one frame per line, bar heights 0..100 separated by ';'.
[general]
bars = 72
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average
