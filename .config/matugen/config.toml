[config]

[config.custom_colors]
red = { color = "#e06c75", blend = true }
green = { color = "#98c379", blend = true }
yellow = { color = "#e5c07b", blend = true }
cyan = { color = "#56b6c2", blend = true }

# Quickshell hot-reloads when this file changes, so no hook needed
[templates.quickshell]
input_path = "~/.config/matugen/templates/Colors.qml"
output_path = "~/.config/quickshell/theme/Colors.qml"
post_hook = "~/.config/matugen/hooks/greeter-sync" # keep the login screen in sync

[templates.hyprland]
input_path = "~/.config/matugen/templates/colors.lua"
output_path = "~/.config/hypr/theme/colors.lua"
post_hook = "hyprctl reload"

[templates.ghostty]
input_path = "~/.config/matugen/templates/ghostty"
output_path = "~/.config/ghostty/themes/matugen"
post_hook = "pkill -USR2 -x ghostty"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.config/nvim/colors/matugen.lua"
post_hook = "pkill -SIGUSR1 nvim || true"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.lazygit]
input_path = "~/.config/matugen/templates/lazygit.yml"
output_path = "~/.config/lazygit/config.yml"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

# mpv's controls (uosc), read when mpv starts
[templates.uosc]
input_path = "~/.config/matugen/templates/uosc.conf"
output_path = "~/.config/mpv/script-opts/uosc.conf"

# Zen's colors, live: Pywalfox reads pywal's colors.json (same 16 colors as the terminal)
[templates.pywal]
input_path = "~/.config/matugen/templates/pywal-colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update 2>/dev/null; true"

# Helium's toolbar/tab colors (Chromium builds its palette from this one color).
# The file is created by browser/install.sh; refresh only if Helium is running.
[templates.helium]
input_path = "~/.config/matugen/templates/helium-color.json"
output_path = "/etc/helium/policies/managed/color.json"
post_hook = "pgrep -x helcanium >/dev/null && helcanium --refresh-platform-policy --no-startup-window; true"
