# Generated by matugen into ~/.config/lazygit/config.yml.
# Edit THIS file (in your dotfiles), not the generated one: it is rewritten
# on every wallpaper change. Add any other lazygit settings below too.
gui:
  theme:
    activeBorderColor: ["{{colors.primary.default.hex}}", bold]
    inactiveBorderColor: ["{{colors.outline_variant.default.hex}}"]
    searchingActiveBorderColor: ["{{colors.tertiary.default.hex}}", bold]
    optionsTextColor: ["{{colors.primary.default.hex}}"]
    # default is 'blue' on dark terminals: matugen's light accent behind light text
    selectedLineBgColor: ["{{colors.primary_container.default.hex}}"]
    inactiveViewSelectedLineBgColor: ["{{colors.surface_container_high.default.hex}}"]
    cherryPickedCommitFgColor: ["{{colors.on_tertiary_container.default.hex}}"]
    cherryPickedCommitBgColor: ["{{colors.tertiary_container.default.hex}}"]
    markedBaseCommitFgColor: ["{{colors.on_secondary_container.default.hex}}"]
    markedBaseCommitBgColor: ["{{colors.secondary_container.default.hex}}"]
    unstagedChangesColor: ["{{colors.red.default.hex}}"]
    defaultFgColor: [default]
